version: '3.8'

services:
  frontend:
    image: nginx:alpine
    ports:
      - "3001:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build: .
    # We do NOT expose ports to the host directly. Nginx proxies to it on internal port 3000.
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/skill_wallet
    depends_on:
      - mongo
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
