<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zentry</title>
    <link rel="stylesheet" href="css/landing.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            /* Use the same hero background as landing + bg.png overlay */
            background: url('uploads/bg.png') no-repeat center center / cover,
                        radial-gradient(circle at 80% 20%, #3051ff 0%, transparent 40%),
                        radial-gradient(circle at 20% 50%, #1c32b5 0%, transparent 40%),
                        linear-gradient(135deg, #08123e 0%, #112bb1 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: var(--font-body);
        }
        
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            z-index: 10;
            width: 50%;
        }

        .auth-container {
            margin: 0 0;
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            border: none;
            padding: 2rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            overflow: hidden; /* Prevent horizontal spill during animation */
        }

        .auth-content-wrapper {
            width: 100%;
        }

        .back-to-login {
            text-align: left;
        }
        .back-to-login a {
            color: #64748b;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .back-to-login a:hover {
            color: #6b46f2;
            transform: translateX(-3px);
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #475569;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .form-group input::placeholder {
            color: #94a3b8;
        }
        .form-group input:focus {
            outline: none;
            border-color: #6b46f2;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(107, 70, 242, 0.15);
        }
        
        .btn-full {
            width: 100%;
            margin-bottom: 1.25rem;
        }
        
        .btn-submit {
            background: linear-gradient(90deg, #6b46f2 0%, #4a5cf6 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 9999px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(107, 70, 242, 0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(107, 70, 242, 0.5);
        }

        .btn-google {
            background: white;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #e2e8f0;
            padding: 14px 24px;
            border-radius: 9999px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 60;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
        .btn-google img {
            width: 22px;
            height: 22px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1rem 0 2rem 0;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider:not(:empty)::before { margin-right: 1rem; }
        .divider:not(:empty)::after { margin-left: 1rem; }
        
        .auth-links {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #64748b;
        }
        .auth-links a {
            color: #6b46f2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .auth-links a:hover {
            color: #4a5cf6;
        }
        
        #alertBox {
            margin-bottom: 1.5rem;
            padding: 12px 16px;
            border-radius: 12px;
            display: none;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: left;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(135deg, #0b154a 0%, #162fbd 100%);
            padding: 2.5rem;
            border-radius: 24px;
            width: 90%;
            max-width: 440px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        .modal-content h3 {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        .modal-content .btn-submit {
            margin-top: 1rem;
        }
        .modal-content .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 14px 24px;
            border-radius: 9999px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }
        .modal-content .btn-cancel:hover {
            background: rgba(255,255,255,0.15);
        }
        @media (max-width: 1000px) {
            .auth-wrapper {
                width: 85%;

            }
        }
        @media (max-width: 480px) {
            .auth-wrapper {
                width: 90%;

            }
        }

        /* Slide-in animation from right */
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide-in-right {
            animation: slideInRight 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
    </style>
</head>
<body>
    <!-- Decorative background elements -->
    <div class="decor-circle decor-1" style="z-index: 0;"></div>
    <div class="decor-circle decor-2" style="z-index: 0;"></div>

    <nav class="navbar container">
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="currentColor"/>
                <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Zentry
        </div>
    </nav>


    <main class="auth-wrapper container">
        <div class="auth-container">
            <div class="back-to-login" id="backToLoginBtn" style="display: none;">
                <a href="#">← back</a>
            </div>
            <div class="auth-content-wrapper">
                <h2 class="auth-title">Welcome Back</h2>
                
                <div id="alertBox"></div>

                <form id="loginForm">
                    <div class="form-group signup-only" style="display: none;">
                        <label>First Name</label>
                        <input type="text" id="firstName" placeholder="John">
                    </div>
                    <div class="form-group signup-only" style="display: none;">
                        <label>Last Name</label>
                        <input type="text" id="lastName" placeholder="Doe">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    
                    <div class="auth-links" style="margin-top: -0.5rem; margin-bottom: 1.5rem; text-align: right;">
                        <a href="#" id="forgotBtn">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-submit btn-full">Sign In</button>
                </form>

                <div class="divider">OR</div>

                <div id="googleLoginBtnContainer" style="display: flex; justify-content: center; margin-top: 1rem; width: 100%;"></div>

                <div class="auth-links" style="margin-top: 2rem;">
                    Don't have an account? <a href="#" id="signupToggle">Sign up here</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <h3>Reset Password</h3>
            <p style="color: rgba(255,255,255,0.7); margin-bottom: 1.5rem; font-size: 0.95rem;">Enter your email and we will send a reset link.</p>
            <div class="form-group">
                <input type="email" id="resetEmail" placeholder="Enter your email" required>
            </div>
            <button class="btn-submit btn-full" id="sendResetBtn">Send Link</button>
            <button class="btn-cancel" id="closeModalBtn">Cancel</button>
        </div>
    </div>

    <!-- OTP Verification Modal -->
    <div class="modal" id="otpModal">
        <div class="modal-content">
            <h3>Email Verification</h3>
            <p style="color: rgba(255,255,255,0.7); margin-bottom: 1.5rem; font-size: 0.95rem;">
                We've sent a 6-digit OTP code to <strong id="otpTargetEmail"></strong>. Please enter it below to complete your registration.
            </p>
            <div class="form-group">
                <label>Verification Code (OTP)</label>
                <input type="text" id="otpCodeInput" placeholder="Enter 6-digit code" required maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 6px; font-weight: bold;">
            </div>
            <button class="btn-submit btn-full" id="verifyOtpBtn">Verify & Register</button>
            <button class="btn-cancel" id="closeOtpModalBtn">Cancel</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const alertBox = document.getElementById('alertBox');
            let isLoginMode = true;
            
            const showAlert = (msg, type = 'error') => {
                alertBox.style.display = 'block';
                alertBox.className = `alert-${type}`;
                alertBox.textContent = msg;
            };

            // Toggle Signup/Signin mode visually
            const signupToggle = document.getElementById('signupToggle');
            const forgotBtnContainer = document.getElementById('forgotBtn').parentElement;
            const authContentWrapper = document.querySelector('.auth-content-wrapper');
            const backToLoginBtn = document.getElementById('backToLoginBtn');
            
            signupToggle.addEventListener('click', (e) => {
                e.preventDefault();
                isLoginMode = !isLoginMode;

                // Trigger slide-in animation from right only on internal content
                authContentWrapper.classList.remove('slide-in-right');
                void authContentWrapper.offsetWidth; // Force reflow to restart animation
                authContentWrapper.classList.add('slide-in-right');

                // Toggle back button visibility (only show in Signup mode)
                backToLoginBtn.style.display = isLoginMode ? 'none' : 'block';

                document.querySelector('.auth-title').textContent = isLoginMode ? 'Welcome Back' : 'Create Account';
                loginForm.querySelector('button[type="submit"]').textContent = isLoginMode ? 'Sign In' : 'Sign Up';
                signupToggle.textContent = isLoginMode ? 'Sign in instead' : 'Sign up here';
                
                // Toggle extra fields
                const signupOnlyFields = document.querySelectorAll('.signup-only');
                signupOnlyFields.forEach(el => el.style.display = isLoginMode ? 'none' : 'block');
                
                // Hide forgot password in signup mode
                forgotBtnContainer.style.display = isLoginMode ? 'block' : 'none';
            });

            // Back to Login click handler
            backToLoginBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (!isLoginMode) {
                    signupToggle.click();
                }
            });

            const otpModal = document.getElementById('otpModal');
            const otpTargetEmail = document.getElementById('otpTargetEmail');
            const otpCodeInput = document.getElementById('otpCodeInput');
            const verifyOtpBtn = document.getElementById('verifyOtpBtn');
            const closeOtpModalBtn = document.getElementById('closeOtpModalBtn');
            let pendingSignupData = null;

            // Handle Form Submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                
                if (isLoginMode) {
                    try {
                        const res = await fetch('/api/auth/signin', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });
                        const data = await res.json();

                        if (!res.ok) throw new Error(data.error || 'Request failed');
                        
                        showAlert('Login successful!', 'success');
                        localStorage.setItem('token', data.token);
                        setTimeout(() => window.location.href = 'dashboard.html', 1000);
                    } catch (err) {
                        showAlert(err.message);
                    }
                } else {
                    // Signup Mode - Send OTP first
                    pendingSignupData = {
                        username: email.split('@')[0],
                        email,
                        password,
                        firstName,
                        lastName
                    };

                    try {
                        showAlert('Sending OTP to your email...', 'success');
                        const res = await fetch('/api/auth/send-otp', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email })
                        });
                        const data = await res.json();

                        if (!res.ok) throw new Error(data.error || 'Failed to send OTP');
                        
                        // Show OTP modal
                        otpTargetEmail.textContent = email;
                        otpCodeInput.value = '';
                        otpModal.style.display = 'flex';
                        alertBox.style.display = 'none'; // hide sending message
                    } catch (err) {
                        showAlert(err.message);
                    }
                }
            });

            // Handle OTP Verification and actual registration
            verifyOtpBtn.addEventListener('click', async () => {
                const otpCode = otpCodeInput.value.trim();
                if (!otpCode || otpCode.length !== 6) {
                    alert('Please enter a valid 6-digit OTP code');
                    return;
                }

                if (!pendingSignupData) return;

                try {
                    verifyOtpBtn.disabled = true;
                    verifyOtpBtn.textContent = 'Verifying...';

                    const signupBody = { ...pendingSignupData, otpCode };
                    const res = await fetch('/api/auth/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(signupBody)
                    });
                    const data = await res.json();

                    if (!res.ok) throw new Error(data.error || 'Registration failed');

                    otpModal.style.display = 'none';
                    showAlert('Registration and Verification successful!', 'success');
                    localStorage.setItem('token', data.token);
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } catch (err) {
                    alert(err.message);
                } finally {
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.textContent = 'Verify & Register';
                }
            });

            closeOtpModalBtn.addEventListener('click', () => {
                otpModal.style.display = 'none';
                pendingSignupData = null;
            });

            // Initialize Real Google Sign-In
            async function initGoogleSignIn() {
                try {
                    // 1. Fetch Client ID from backend config
                    const configRes = await fetch('/api/auth/google-client-id');
                    const configData = await configRes.json();
                    const clientId = configData.clientId;

                    if (!clientId || clientId.includes('your-google-client-id')) {
                        console.warn('Google Client ID is not configured on the server. Falling back to mock login helper.');
                        renderMockGoogleBtn();
                        return;
                    }

                    // 2. Initialize Google Identity Services
                    google.accounts.id.initialize({
                        client_id: clientId,
                        callback: handleGoogleCredentialResponse
                    });

                    // 3. Render Google Sign-In Button
                    google.accounts.id.renderButton(
                        document.getElementById('googleLoginBtnContainer'),
                        { 
                            theme: 'outline', 
                            size: 'large', 
                            width: '380', 
                            shape: 'pill',
                            logo_alignment: 'left'
                        }
                    );

                    // 4. Prompt Google One Tap
                    google.accounts.id.prompt();

                } catch (err) {
                    console.error('Failed to initialize Google Sign-In:', err);
                    renderMockGoogleBtn(); // Fallback to mock helper if backend fails
                }
            }

            // Handler for the ID Token returned by Google
            async function handleGoogleCredentialResponse(response) {
                try {
                    showAlert('Logging in with Google...', 'success');
                    const res = await fetch('/api/auth/google-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ idToken: response.credential })
                    });
                    const data = await res.json();

                    if (!res.ok) throw new Error(data.error || 'Google authentication failed');

                    showAlert('Google login successful!', 'success');
                    localStorage.setItem('token', data.token);
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } catch (err) {
                    showAlert(err.message);
                }
            }

            // Fallback helper to allow testing with mock token if no client ID is set
            function renderMockGoogleBtn() {
                const container = document.getElementById('googleLoginBtnContainer');
                container.innerHTML = `
                    <button class="btn-google" style="margin-top: 0.5rem;" id="mockGoogleBtn">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                        Sign in with Google (Mock)
                    </button>
                `;
                document.getElementById('mockGoogleBtn').addEventListener('click', async () => {
                    try {
                        const res = await fetch('/api/auth/google-login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ idToken: 'mock_google_token_123' })
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error);
                        showAlert('Mock Google Login Successful!', 'success');
                        localStorage.setItem('token', data.token);
                        setTimeout(() => window.location.href = 'dashboard.html', 1000);
                    } catch (err) {
                        showAlert(err.message);
                    }
                });
            }

            // Run Google Sign-In Initialization
            initGoogleSignIn();

            // Handle Forgot Password
            const forgotModal = document.getElementById('forgotModal');
            document.getElementById('forgotBtn').addEventListener('click', (e) => {
                e.preventDefault();
                forgotModal.style.display = 'flex';
            });
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                forgotModal.style.display = 'none';
            });
            
            document.getElementById('sendResetBtn').addEventListener('click', async () => {
                const email = document.getElementById('resetEmail').value;
                if(!email) return alert('Enter email');
                try {
                    const res = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);
                    alert(data.message);
                    forgotModal.style.display = 'none';
                } catch (err) {
                    alert(err.message);
                }
            });
        });
    </script>
</body>
</html>
