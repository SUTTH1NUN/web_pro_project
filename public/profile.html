<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SkillWallet</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .profile-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        @media (max-width: 800px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar Styles */
        .sidebar {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            height: fit-content;
            text-align: center;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #e2e8f0;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #a0aec0;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .display-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 0.25rem;
        }

        .username {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .bio {
            color: #4a5568;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .work-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #4a5568;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .btn-edit {
            width: 100%;
            background: #edf2f7;
            color: #2d3748;
            border: 1px solid #cbd5e0;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .btn-edit:hover {
            background: #e2e8f0;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 0.75rem;
        }

        /* Radar Chart & Breakdown */
        .chart-wrapper {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            align-items: center;
        }

        @media (max-width: 600px) {
            .chart-wrapper { grid-template-columns: 1fr; }
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .skills-breakdown {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .overall-score-box {
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .overall-label {
            color: #2b6cb0;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .overall-number {
            font-size: 3rem;
            font-weight: 800;
            color: #2c5282;
            line-height: 1;
        }

        .skill-row {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a5568;
        }

        .skill-bar-bg {
            background: #edf2f7;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .skill-bar-fill {
            background: #3182ce;
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease-in-out;
        }

        /* Badges / Evidences */
        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .evidence-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            background: #fafcff;
        }

        .evidence-item h4 {
            font-size: 1rem;
            color: #2d3748;
            margin-bottom: 0.25rem;
        }

        .evidence-item p {
            font-size: 0.85rem;
            color: #718096;
            margin-bottom: 0.5rem;
        }

        .badge-verified {
            display: inline-block;
            background: #c6f6d5;
            color: #22543d;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #a0aec0;
        }

        /* Form Styles (From previous) */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-save {
            background: #3182ce;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
            width: 100%;
        }

        .btn-save:hover {
            background: #2b6cb0;
        }

    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">SkillWallet</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="test.html">Tests</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="admin.html" style="color: #ed8936; font-weight: 700;">Admin</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="profile-layout">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="avatar">
                <!-- Default SVG Avatar -->
                <svg width="60" height="60" fill="currentColor" viewBox="0 0 24 24"><path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
            </div>
            
            <h1 class="display-name" id="uiName">Loading...</h1>
            <p class="username" id="uiUsername">@username</p>
            
            <p class="bio" id="uiBio">Your bio will appear here. Edit your profile to add some details.</p>
            
            <div class="work-info" id="uiWork">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <span id="uiJobOrg">Job at Organization</span>
            </div>

            <button class="btn-edit" onclick="openEditModal()">Edit Profile</button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Radar Chart Card -->
            <div class="card">
                <h2 class="card-title">Language Skills Overview</h2>
                <div class="chart-wrapper">
                    <div class="chart-container">
                        <canvas id="skillsChart"></canvas>
                    </div>
                    <div class="skills-breakdown" id="skillsBreakdown">
                        <!-- Populated by JS -->
                        <p style="color: #a0aec0;">Loading breakdown...</p>
                    </div>
                </div>
            </div>

            <!-- Credentials Card -->
            <div class="card">
                <h2 class="card-title">Verified Credentials</h2>
                <div class="evidence-grid" id="evidenceGrid">
                    <p style="color: #a0aec0; grid-column: 1/-1;">Loading credentials...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeEditModal()">×</button>
            <h2 style="margin-bottom: 1.5rem;">Edit Profile</h2>
            
            <form id="profileForm">
                
                <div class="form-group">
                    <label for="username">Display Name (Username)</label>
                    <input type="text" id="username" name="username" placeholder="e.g. johndoe99">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" placeholder="e.g. John">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" placeholder="e.g. Doe">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="jobTitle">Job Title</label>
                        <input type="text" id="jobTitle" name="jobTitle" placeholder="e.g. Software Engineer">
                    </div>
                    <div class="form-group">
                        <label for="organization">Organization</label>
                        <input type="text" id="organization" name="organization" placeholder="e.g. Google">
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" placeholder="Write a short introduction about yourself..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="linkedinUrl">LinkedIn URL</label>
                        <input type="url" id="linkedinUrl" name="linkedinUrl" placeholder="https://linkedin.com/in/username">
                    </div>
                    <div class="form-group">
                        <label for="portfolioUrl">Website URL</label>
                        <input type="url" id="portfolioUrl" name="portfolioUrl" placeholder="https://yourwebsite.com">
                    </div>
                </div>

                <button type="submit" class="btn-save" id="saveBtn">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        let chartInstance = null;

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        function openEditModal() {
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // Fetch User Profile
        async function fetchProfile() {
            try {
                const res = await fetch('/api/users/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    const user = data.user;
                    
                    // Update UI Sidebar
                    const fullName = `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.username || 'User';
                    document.getElementById('uiName').innerText = fullName;
                    document.getElementById('uiUsername').innerText = `@${user.username}`;
                    
                    if(user.bio) {
                        document.getElementById('uiBio').innerText = user.bio;
                    }

                    if(user.jobTitle || user.organization) {
                        document.getElementById('uiJobOrg').innerText = `${user.jobTitle || 'Professional'} @ ${user.organization || 'Independent'}`;
                        document.getElementById('uiWork').style.display = 'flex';
                    } else {
                        document.getElementById('uiWork').style.display = 'none';
                    }

                    // Populate Form
                    document.getElementById('username').value = user.username || '';
                    document.getElementById('firstName').value = user.firstName || '';
                    document.getElementById('lastName').value = user.lastName || '';
                    document.getElementById('jobTitle').value = user.jobTitle || '';
                    document.getElementById('organization').value = user.organization || '';
                    document.getElementById('bio').value = user.bio || '';
                    document.getElementById('linkedinUrl').value = user.linkedinUrl || '';
                    document.getElementById('portfolioUrl').value = user.portfolioUrl || '';

                    // Ensure stats object exists
                    const stats = user.stats || { speaking: 0, listening: 0, reading: 0, writing: 0 };

                    // Render Chart
                    renderChart(stats);
                }
            } catch (err) {
                console.error('Error fetching profile:', err);
            }
        }

        // Fetch Evidences for the bottom section
        async function fetchEvidences() {
            try {
                const res = await fetch('/api/evidence', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const evidences = data.evidences;
                    const grid = document.getElementById('evidenceGrid');
                    
                    if (evidences.length === 0) {
                        grid.innerHTML = '<p style="color: #a0aec0; grid-column: 1/-1;">No credentials yet. Add some on your dashboard!</p>';
                        return;
                    }

                    grid.innerHTML = '';
                    evidences.forEach(ev => {
                        let statusHtml = '';
                        if (ev.verificationStatus === 'verified') {
                            statusHtml = '<span class="badge-verified">✓ Verified</span>';
                        } else if (ev.verificationStatus === 'processing') {
                            statusHtml = '<span class="badge-verified" style="background: #ebf8ff; color: #2b6cb0;">⏳ Processing</span>';
                        } else {
                            statusHtml = '<span class="badge-verified" style="background: #feebc8; color: #c05621;">⌛ Pending</span>';
                        }

                        grid.innerHTML += `
                            <div class="evidence-item">
                                <h4>${ev.testType}</h4>
                                <p>Score: ${ev.extractedScore || 'N/A'}</p>
                                ${statusHtml}
                            </div>
                        `;
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Render Radar Chart using Chart.js
        function renderChart(stats) {
            const ctx = document.getElementById('skillsChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Speaking', 'Listening', 'Reading', 'Writing'],
                    datasets: [{
                        label: 'Proficiency Score',
                        data: [stats.speaking || 0, stats.listening || 0, stats.reading || 0, stats.writing || 0],
                        backgroundColor: 'rgba(49, 130, 206, 0.2)',
                        borderColor: '#3182ce',
                        pointBackgroundColor: '#3182ce',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#3182ce',
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(0, 0, 0, 0.1)' },
                            grid: { color: 'rgba(0, 0, 0, 0.1)' },
                            pointLabels: {
                                font: {
                                    family: 'Inter',
                                    size: 14,
                                    weight: '600'
                                },
                                color: '#4a5568'
                            },
                            ticks: {
                                display: false, // hide the numbers on the axis
                                min: 0,
                                max: 10
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // Render Breakdown (Scale out of 10)
            let totalSkills = 0;
            let sumScore = 0;
            
            const spk = stats.speaking || 0;
            const lis = stats.listening || 0;
            const rdn = stats.reading || 0;
            const wrt = stats.writing || 0;

            if (spk > 0) { sumScore += spk; totalSkills++; }
            if (lis > 0) { sumScore += lis; totalSkills++; }
            if (rdn > 0) { sumScore += rdn; totalSkills++; }
            if (wrt > 0) { sumScore += wrt; totalSkills++; }

            const overall = totalSkills > 0 ? (sumScore / totalSkills).toFixed(1) : "0.0";
            const breakdownHtml = `
                <div class="overall-score-box">
                    <div class="overall-label">Overall Proficiency</div>
                    <div class="overall-number">${overall}</div>
                </div>
                
                <div class="skill-row">
                    <div class="skill-header"><span>Speaking</span><span>${stats.speaking || 0}/10</span></div>
                    <div class="skill-bar-bg"><div class="skill-bar-fill" style="width: ${(stats.speaking || 0) * 10}%;"></div></div>
                </div>
                <div class="skill-row">
                    <div class="skill-header"><span>Listening</span><span>${stats.listening || 0}/10</span></div>
                    <div class="skill-bar-bg"><div class="skill-bar-fill" style="width: ${(stats.listening || 0) * 10}%;"></div></div>
                </div>
                <div class="skill-row">
                    <div class="skill-header"><span>Reading</span><span>${stats.reading || 0}/10</span></div>
                    <div class="skill-bar-bg"><div class="skill-bar-fill" style="width: ${(stats.reading || 0) * 10}%;"></div></div>
                </div>
                <div class="skill-row">
                    <div class="skill-header"><span>Writing</span><span>${stats.writing || 0}/10</span></div>
                    <div class="skill-bar-bg"><div class="skill-bar-fill" style="width: ${(stats.writing || 0) * 10}%;"></div></div>
                </div>
            `;
            document.getElementById('skillsBreakdown').innerHTML = breakdownHtml;
        }

        // Form Submit
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Saving...';
            btn.disabled = true;

            const payload = {
                username: document.getElementById('username').value,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                jobTitle: document.getElementById('jobTitle').value,
                organization: document.getElementById('organization').value,
                bio: document.getElementById('bio').value,
                linkedinUrl: document.getElementById('linkedinUrl').value,
                portfolioUrl: document.getElementById('portfolioUrl').value
            };

            try {
                const res = await fetch('/api/users/me', {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeEditModal();
                    fetchProfile(); // Refresh UI
                } else {
                    alert('Failed to update profile');
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred.');
            } finally {
                btn.innerText = 'Save Changes';
                btn.disabled = false;
            }
        });

        // Init
        fetchProfile();
        fetchEvidences();
    </script>
</body>
</html>
