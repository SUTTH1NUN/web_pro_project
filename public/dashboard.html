<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Zentry</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .welcome-text h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 0.25rem;
        }

        .welcome-text p {
            color: var(--text-gray);
            font-size: 1.1rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        /* Credential Grid */
        .credential-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .credential-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 2rem;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-light);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .credential-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .credential-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: #e53e3e;
        }

        .credential-card.IELTS::before { background: #e53e3e; }
        .credential-card.TOEIC::before { background: #435eea; }
        .credential-card.TOEFL::before { background: #d69e2e; }

        .card-type-badge {
            display: inline-block;
            background: #fff5f5;
            color: #c53030;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .credential-card.TOEIC .card-type-badge { background: #f0f4ff; color: #435eea; }
        .credential-card.TOEFL .card-type-badge { background: #fffff0; color: #b7791f; }

        .card-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .card-score {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-score svg {
            width: 24px;
            height: 24px;
            color: #e53e3e;
        }

        .sub-scores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--bg-light);
            padding: 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            color: var(--text-dark);
            border: 1px solid var(--border-light);
        }

        .sub-score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sub-score-label {
            color: var(--text-gray);
            font-weight: 500;
        }
        
        .sub-score-value {
            font-weight: 700;
            color: #435eea;
        }

        .card-footer {
            border-top: 1px solid var(--border-light);
            padding-top: 1rem;
            color: var(--text-gray);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .card-footer .date {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Pending Review State */
        .credential-card.pending {
            opacity: 0.8;
        }

        .pending-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .pending-badge {
            background: #dd6b20;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-full);
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(221, 107, 32, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="currentColor" />
                <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Zentry
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="test.html">Tests</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html" class="nav-admin">Admin</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <main class="container" style="max-width: 1200px;">
        <div class="dashboard-header">
            <div class="welcome-text">
                <h1 id="welcomeTitle">Welcome back 👋</h1>
                <p id="credentialCount">0 credentials in your wallet</p>
            </div>
            <div class="header-actions">
                <button class="btn-outline" onclick="shareProfile()" id="shareBtn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    Share Profile
                </button>
                <button class="btn-outline" onclick="window.location.href='portfolio.html'">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Generate PDF
                </button>
                <button class="btn-primary" onclick="openModal()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Add Score
                </button>
            </div>
        </div>

        <div class="credential-grid" id="credentialGrid">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Upload Certificate</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="testType">Certificate Type</label>
                    <select id="testType" name="testType" required>
                        <option value="">Select a certificate type...</option>
                        <option value="TOEIC">TOEIC</option>
                        <option value="Linguaskill">Linguaskill</option>
                        <option value="IELTS">IELTS</option>
                        <option value="TOEFL">TOEFL</option>
                        <option value="Duolingo English Test">Duolingo English Test</option>
                        <option value="TETET">TETET</option>
                        <option value="CU-TEP">CU-TEP</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="file">Upload Certificate (PDF, JPG, PNG)</label>
                    <input type="file" id="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;" id="submitBtn">Upload and Verify</button>
            </form>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>Certificate Details</h2>
                <button class="close-btn" onclick="closeDetailsModal()">&times;</button>
            </div>
            <div class="modal-body" style="padding: 1.5rem; overflow-y: auto; max-height: 70vh;">
                <img id="detailImage" src="" alt="Certificate Image" style="width: 100%; max-height: 300px; object-fit: contain; background: var(--bg-light); border-radius: var(--radius-md); border: 1px solid var(--border-medium); margin-bottom: 1.5rem;">
                
                <h3 style="margin-top: 0; font-size: 1.1rem; color: var(--text-dark);">Information</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div><span style="color: var(--text-gray); font-size: 0.85rem;">Test Type</span><div id="detailType" style="font-weight: 600;"></div></div>
                    <div><span style="color: var(--text-gray); font-size: 0.85rem;">Test Date</span><div id="detailDate" style="font-weight: 600;"></div></div>
                    <div><span style="color: var(--text-gray); font-size: 0.85rem;">Verification Code</span><div id="detailCode" style="font-weight: 600;"></div></div>
                    <div><span style="color: var(--text-gray); font-size: 0.85rem;">Status</span><div id="detailStatus" style="font-weight: 600; text-transform: capitalize;"></div></div>
                </div>

                <h3 style="margin-top: 0; font-size: 1.1rem; color: var(--text-dark);">Scores</h3>
                <div style="background: var(--bg-light); padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-light);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;"><span style="color: var(--text-gray);">Reading:</span> <strong id="detailReading">N/A</strong></div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;"><span style="color: var(--text-gray);">Listening:</span> <strong id="detailListening">N/A</strong></div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;"><span style="color: var(--text-gray);">Speaking:</span> <strong id="detailSpeaking">N/A</strong></div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;"><span style="color: var(--text-gray);">Writing:</span> <strong id="detailWriting">N/A</strong></div>
                    <hr style="border: 0; border-top: 1px solid var(--border-medium); margin: 1rem 0;">
                    <div style="display: flex; justify-content: space-between; font-size: 1.25rem;"><span style="color: #435eea; font-weight: 700;">Total Score:</span> <strong id="detailTotal" style="color: #435eea; font-weight: 800;">N/A</strong></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        let currentEvidences = [];
        const username = localStorage.getItem('username');
        if (!token) {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        function openModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.getElementById('uploadForm').reset();
        }

        function openDetailsModal(index) {
            const ev = currentEvidences[index];
            document.getElementById('detailImage').src = `/uploads/${ev.filename}`;
            document.getElementById('detailType').innerText = ev.testType || 'N/A';
            
            const ed = ev.extractedData || {};
            document.getElementById('detailDate').innerText = ed.testDate || 'N/A';
            document.getElementById('detailCode').innerText = ed.verificationCode || 'N/A';
            document.getElementById('detailStatus').innerText = ev.verificationStatus || 'N/A';
            
            document.getElementById('detailReading').innerText = ed.rawReading || 'N/A';
            document.getElementById('detailListening').innerText = ed.rawListening || 'N/A';
            document.getElementById('detailSpeaking').innerText = ed.rawSpeaking || 'N/A';
            document.getElementById('detailWriting').innerText = ed.rawWriting || 'N/A';
            
            document.getElementById('detailTotal').innerText = ed.totalScore || ev.extractedScore || 'N/A';
            
            document.getElementById('detailsModal').classList.add('active');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        let pollingTimer = null;
        async function fetchEvidences() {
            try {
                const res = await fetch('/api/evidence', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 401) {
                    logout();
                    return;
                }

                const data = await res.json();
                renderEvidences(data.evidences);

                // Polling logic
                if (pollingTimer) clearTimeout(pollingTimer);
                const hasProcessing = data.evidences.some(ev => ev.verificationStatus === 'processing');
                if (hasProcessing) {
                    pollingTimer = setTimeout(fetchEvidences, 3000);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderEvidences(evidences) {
            const grid = document.getElementById('credentialGrid');
            grid.innerHTML = '';

            document.getElementById('credentialCount').innerText = `${evidences.length} credential${evidences.length !== 1 ? 's' : ''} in your wallet`;

            currentEvidences = evidences;
            evidences.forEach((ev, index) => {
                const isProcessing = ev.verificationStatus === 'processing';
                const isPending = ev.verificationStatus === 'pending';
                const isRejected = ev.verificationStatus === 'rejected';
                
                const score = ev.extractedScore || 'N/A';
                const dateStr = (ev.extractedData && ev.extractedData.testDate) 
                    ? new Date(ev.extractedData.testDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) 
                    : 'Unknown Date';
                const code = (ev.extractedData && ev.extractedData.verificationCode) ? ev.extractedData.verificationCode : 'No Code';

                const card = document.createElement('div');
                card.className = `credential-card ${ev.testType.split(' ')[0]} ${isPending || isProcessing || isRejected ? 'pending' : ''}`;
                card.style.cursor = 'pointer';
                card.onclick = () => openDetailsModal(index);
                
                let pendingHTML = '';
                if (isProcessing) {
                    pendingHTML = `
                        <div class="pending-overlay" style="background: rgba(235, 248, 255, 0.8);">
                            <div class="pending-badge" style="background: #435eea; box-shadow: 0 4px 10px rgba(67, 94, 234, 0.3);">
                                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                AI Processing...
                            </div>
                        </div>
                    `;
                } else if (isPending) {
                    pendingHTML = `
                        <div class="pending-overlay">
                            <div class="pending-badge">
                                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Pending Admin Review
                            </div>
                        </div>
                    `;
                } else if (isRejected) {
                    pendingHTML = `
                        <div class="pending-overlay" style="background: rgba(254, 226, 226, 0.9); flex-direction: column; text-align: center; padding: 1rem;">
                            <div class="pending-badge" style="background: #e53e3e; box-shadow: 0 4px 10px rgba(229, 62, 62, 0.3); margin-bottom: 0.5rem;">
                                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                Rejected
                            </div>
                            <div style="color: #c53030; font-size: 0.85rem; font-weight: 600; max-width: 90%;">
                                Reason: ${ev.rejectionReason || 'No reason provided.'}
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${pendingHTML}
                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <span class="card-type-badge">${ev.testType}</span>
                            <div style="display: flex; gap: 0.5rem; position: relative; z-index: 20;">
                                <button onclick="event.stopPropagation(); togglePrivacy('${ev._id}', ${!ev.isPrivate})" style="background:none; border:none; color:${ev.isPrivate ? '#e53e3e' : '#4a5568'}; cursor:pointer;" title="${ev.isPrivate ? 'Make Public' : 'Make Private'}">
                                    ${ev.isPrivate 
                                        ? `<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>`
                                        : `<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>`
                                    }
                                </button>
                                <button onclick="event.stopPropagation(); deleteEvidence('${ev._id}')" style="background:none; border:none; color:#4a5568; cursor:pointer;" title="Delete Score">
                                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div class="card-subtitle">English Proficiency</div>
                        <div class="card-score">
                            ${score}
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="date">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            ${dateStr}
                        </div>
                        <div>${code}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Upload Form Handler
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;

            btn.innerText = 'Uploading...';
            btn.disabled = true;

            try {
                const formData = new FormData(form);
                const res = await fetch('/api/evidence/upload-cert', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (!res.ok) {
                    const errorData = await res.json();
                    alert(errorData.error || 'Upload failed');
                } else {
                    closeModal();
                    fetchEvidences(); // Refresh grid
                }
            } catch (err) {
                alert('An error occurred during upload.');
                console.error(err);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // Delete Evidence
        async function deleteEvidence(id) {
            if (!confirm('Are you sure you want to delete this score?')) return;

            try {
                const res = await fetch(`/api/evidence/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    const data = await res.json();
                    alert(data.error || 'Failed to delete score');
                    return;
                }

                fetchEvidences(); // refresh list
            } catch (err) {
                console.error(err);
                alert('An error occurred while deleting the score');
            }
        }

        // Toggle Privacy
        async function togglePrivacy(id, newStatus) {
            try {
                const res = await fetch(`/api/evidence/${id}/privacy`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ isPrivate: newStatus })
                });

                if (!res.ok) {
                    alert('Failed to update privacy status');
                    return;
                }

                fetchEvidences(); // refresh list
            } catch (err) {
                console.error(err);
                alert('An error occurred');
            }
        }

        // Share public profile link
        async function shareProfile() {
            try {
                const userRes = await fetch('/api/users/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!userRes.ok) return;
                const userData = await userRes.json();
                const uname = userData.user.username;
                const shareUrl = `${window.location.origin}/profile.html?user=${uname}`;
                await navigator.clipboard.writeText(shareUrl);
                const btn = document.getElementById('shareBtn');
                const original = btn.innerHTML;
                btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Link Copied!`;
                btn.style.background = '#48bb78';
                btn.style.color = 'white';
                btn.style.borderColor = '#48bb78';
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.style.background = '';
                    btn.style.color = '';
                    btn.style.borderColor = '';
                }, 2500);
            } catch (err) {
                console.error(err);
                alert('Could not copy link. Try again.');
            }
        }

        // Initial Load
        async function initDashboard() {
            try {
                // Fetch user profile for welcome message
                const userRes = await fetch('/api/users/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (userRes.ok) {
                    const userData = await userRes.json();
                    const displayName = userData.user.username || userData.user.firstName || 'User';
                    document.getElementById('welcomeTitle').innerText = `Welcome back, ${displayName} 👋`;
                }

                // Fetch evidences
                await fetchEvidences();
            } catch (err) {
                console.error('Error init dashboard:', err);
            }
        }

        initDashboard();
    </script>
</body>
</html>
